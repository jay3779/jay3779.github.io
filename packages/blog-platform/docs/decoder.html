<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Itty-Bitty Decoder</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    .decoder-container {
      background: white;
      border-radius: 12px;
      padding: 30px;
      max-width: 900px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      margin-top: 20px;
    }
    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
    }
    .back-link:hover { text-decoration: underline; }
    h1 { color: #333; margin-bottom: 20px; font-size: 1.8em; }
    #content {
      line-height: 1.6;
      color: #333;
    }
    .error-box {
      background: #fff5f5;
      border-left: 4px solid #f56565;
      padding: 15px;
      border-radius: 4px;
      color: #c53030;
    }
    #iframe-container {
      width: 100%;
      height: 70vh;
      border-radius: 8px;
      border: 1px solid #eee;
      overflow: hidden;
    }
    iframe { width: 100%; height: 100%; border: none; }
    .loading { text-align: center; padding: 40px; color: #666; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/pako@2/dist/pako.min.js"></script>
</head>
<body>
  <div class="decoder-container">
    <a href="index.html" class="back-link">← Back to Blog</a>
    <h1 id="postTitle">Decoding...</h1>
    
    <div id="content">
      <div class="loading">
        <p>Loading post content...</p>
      </div>
    </div>
  </div>

  <script>
    function base64ToUint8Array(base64) {
      if (!base64) return new Uint8Array(0);
      const b64 = base64.replace(/-/g, '+').replace(/_/g, '/');
      const padding = (4 - (b64.length % 4)) % 4;
      const normalized = b64 + '='.repeat(padding);
      try {
        const binary = atob(normalized);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }
        return bytes;
      } catch (e) {
        console.error('Base64 decode failed:', e);
        return new Uint8Array(0);
      }
    }

    async function inflateBytes(bytes) {
      if (typeof DecompressionStream !== 'undefined') {
        try {
          const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate'));
          return await new Response(stream).text();
        } catch (e) {
          console.warn('DecompressionStream failed, falling back:', e);
        }
      }

      if (typeof pako !== 'undefined') {
        try {
          return pako.inflate(bytes, { to: 'string' });
        } catch (inflateError) {
          try {
            return pako.ungzip(bytes, { to: 'string' });
          } catch (gzipError) {
            console.warn('pako decompression failed:', inflateError, gzipError);
          }
        }
      }

      throw new Error('Could not decompress data.');
    }

    function renderContent(contentDiv, decompressed) {
      if (decompressed.trim().startsWith('<')) {
        contentDiv.innerHTML = '<div id="iframe-container"></div>';
        const iframe = document.createElement('iframe');
        document.getElementById('iframe-container').appendChild(iframe);
        const doc = iframe.contentDocument || iframe.contentWindow.document;
        doc.open();
        doc.write(decompressed);
        doc.close();
        return;
      }

      if (typeof marked !== 'undefined') {
        contentDiv.innerHTML = marked.parse(decompressed);
        return;
      }

      contentDiv.innerHTML = '<div style="white-space: pre-wrap; font-family: inherit;">' +
        decompressed.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</div>';
    }

    async function decode() {
      const hash = window.location.hash.substring(1);
      const contentDiv = document.getElementById('content');
      const titleEl = document.getElementById('postTitle');
      
      if (!hash) {
        contentDiv.innerHTML = '<div class="error-box">No post data found in URL.</div>';
        titleEl.textContent = 'Error';
        return;
      }

      try {
        const parts = hash.split('/');
        let title = 'Untitled Post';
        let payload = hash;

        if (parts.length > 1) {
          title = decodeURIComponent(parts[0]);
          payload = parts.slice(1).join('/');
        }

        titleEl.textContent = title;
        const bytes = base64ToUint8Array(payload);
        
        if (bytes.length === 0) {
          throw new Error('Failed to decode post data (invalid base64).');
        }
        
        const decompressed = await inflateBytes(bytes);
        renderContent(contentDiv, decompressed);
      } catch (err) {
        contentDiv.innerHTML = '<div class="error-box"><strong>Decode Error:</strong> ' + err.message + '</div>';
        titleEl.textContent = 'Error';
      }
    }

    window.onload = decode;
    window.onhashchange = decode;
  </script>
</body>
</html>
